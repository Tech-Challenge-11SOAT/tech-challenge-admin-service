services:
  # Banco de dados PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: tc-admin-postgres
    environment:
      POSTGRES_DB: tc-admin
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tc-admin-network

  # Aplicação Spring Boot
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: tc-admin-app
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/tc-admin
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tc-admin-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  tc-admin-network:
    driver: bridge
