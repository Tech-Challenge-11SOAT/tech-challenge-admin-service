spring:
  application:
    name: techchallange-admin
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/tc-admin}
      database: ${MONGODB_DATABASE:tc-admin}

server:
  port: 8080
  servlet:
    context-path: /

logging:
  level:
    root: INFO
    '[br.com.postech.techchallange_admin]': DEBUG
    '[org.springframework.data.mongodb]': DEBUG

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

jwt:
  secret: palmeirasNaoTemMundialVitorNhoqueEMuitoBagreVaiCorinthians2012
  access-token-expiration: 900000       # 15 minutos
  refresh-token-expiration: 604800000  # 7 dias
